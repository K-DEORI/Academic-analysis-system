{% extends "admin_base.html" %}
{% block title %}Add Student – SRMS{% endblock %}
{% block page_title %}Add Student{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">🎓 Register Student</div>
  <a href="{{ url_for('manage_students') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Full Name</label>
        <input type="text" name="name" class="form-control" placeholder="Student full name" required>
      </div>
      <div class="form-group">
        <label class="form-label">Roll ID</label>
        <input type="text" name="roll_id" class="form-control" placeholder="e.g., 101, STU001" required>
        <div class="form-hint">Must be unique</div>
      </div>
      <div class="form-group">
        <label class="form-label">Class</label>
        <select name="class_id" class="form-control" required>
          <option value="">Select Class</option>
          {% for cls in classes %}
          <option value="{{ cls.id }}">{{ cls.class_name }} – Section {{ cls.section }}</option>
          {% endfor %}
        </select>
      </div>
      <div class="form-group">
        <label class="form-label">Email (optional)</label>
        <input type="email" name="email" class="form-control" placeholder="student@email.com">
      </div>
      <button type="submit" class="btn btn-success">✓ Register Student</button>
    </form>
  </div>
</div>
{% endblock %}
