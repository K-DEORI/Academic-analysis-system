{% extends "admin_base.html" %}
{% block title %}Edit Class – SRMS{% endblock %}
{% block page_title %}Edit Class{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">✏ Edit Class</div>
  <a href="{{ url_for('manage_classes') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Class Name</label>
        <input type="text" name="class_name" class="form-control" value="{{ cls.class_name }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Class Name in Numeric</label>
        <input type="number" name="class_numeric" class="form-control" value="{{ cls.class_numeric }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Section</label>
        <input type="text" name="section" class="form-control" value="{{ cls.section }}" required>
      </div>
      <button type="submit" class="btn btn-warning">✓ Update</button>
    </form>
  </div>
</div>
{% endblock %}
