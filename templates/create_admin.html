{% extends "admin_base.html" %}
{% block title %}Create Admin – SRMS{% endblock %}
{% block page_title %}Create Admin{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">🛡️ Create Admin Account</div>
  <a href="{{ url_for('manage_admins') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:560px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Username</label>
        <input type="text" name="username" class="form-control" placeholder="Admin username" required>
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" name="password" class="form-control" placeholder="Admin password" required>
      </div>
      <button type="submit" class="btn btn-success">✓ Submit</button>
    </form>
  </div>
</div>
{% endblock %}
