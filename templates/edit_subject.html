{% extends "admin_base.html" %}
{% block title %}Edit Subject – SRMS{% endblock %}
{% block page_title %}Edit Subject{% endblock %}
{% block content %}
<div class="page-header">
  <div class="page-title">✏ Edit Subject</div>
  <a href="{{ url_for('manage_subjects') }}" class="btn btn-outline">← Back</a>
</div>
<div class="card" style="max-width:520px;">
  <div class="card-body">
    <form method="POST">
      <div class="form-group">
        <label class="form-label">Subject Name</label>
        <input type="text" name="subject_name" class="form-control" value="{{ sub.subject_name }}" required>
      </div>
      <div class="form-group">
        <label class="form-label">Subject Code</label>
        <input type="text" name="subject_code" class="form-control" value="{{ sub.subject_code }}" required>
      </div>
      <button type="submit" class="btn btn-warning">✓ Update</button>
    </form>
  </div>
</div>
{% endblock %}
